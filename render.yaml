services:
  - type: web
    name: becris-lead-alerts
    runtime: node
    # Starter keeps the service awake; the free plan sleeps and can delay alerts ~1 min.
    plan: starter
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_PAGE_ID
        value: "1146970505169606"
      - key: BUSINESS_NAME
        value: Becris Detailer
      - key: LEAD_TIMEZONE
        value: America/New_York
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_SMS_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
